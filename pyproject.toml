[project]
name = "weorangesky-stats-card"
version = "0.1"
description = "Generates the GitHub stats card used in the profile README."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S310: requests only target the hardcoded https://api.github.com.
"scripts/*" = ["S310"]
"tests/*" = ["S", "SIM117", "RUF001"]
